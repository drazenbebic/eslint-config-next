version: 2

updates:
  # Keep the shared ESLint stack current. Runtime deps are what consumers
  # actually install, so they get their own group and separate PRs.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      eslint-stack:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.x declares `typescript: ">=4.8.4 <6.1.0"`, so TS 7
      # breaks the parser. Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
